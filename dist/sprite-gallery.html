<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DesiDrive V2 — Sprite QA</title>
  <style>
    body { margin: 0; background: #07121b; color: #fdd57c; font: bold 14px monospace; text-align: center; }
    h1 { margin: 18px auto; }
    canvas { display: block; max-width: 100vw; max-height: calc(100vh - 70px); height: auto; margin: auto; border: 4px solid #d49b46; }
  </style>
</head>
<body>
  <h1>DESIDRIVE V2 — ACTUAL IN-GAME SPRITES</h1>
  <canvas id="gallery" width="600" height="800"></canvas>
  <script src="v2-visuals.js"></script>
  <script>
    const canvas = document.getElementById('gallery');
    const ctx = canvas.getContext('2d');
    const entries = [
      ['MOTORCYCLE', 'motorcycle', 175, 150], ['AUTO', 'auto', 300, 150], ['CAR', 'car', 425, 150],
      ['SUV', 'suv', 175, 350], ['LORRY', 'lorry', 300, 350], ['BUS', 'bus', 425, 350],
      ['COW', 'cow', 225, 520], ['BUFFALO', 'buf', 390, 520],
      ['PEDESTRIAN', 'p', 225, 700], ['STREET DOG', 'dog', 390, 700]
    ];
    function render() {
      ctx.fillStyle = '#162535'; ctx.fillRect(0,0,600,800);
      ctx.fillStyle = '#2b2c32'; ctx.fillRect(110,0,380,800);
      ctx.strokeStyle = '#f9c943'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(300,0); ctx.lineTo(300,800); ctx.stroke();
      for (const [label, kind, x, y] of entries) {
        const isVehicle = ['motorcycle','auto','car','suv','lorry','bus'].includes(kind);
        V2Art.drawEntity(ctx, isVehicle ? {t:'v',v2VisualKind:kind,x} : {t:kind,x}, y, {});
        ctx.fillStyle = '#ffdf97'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
        ctx.fillText(label, x, y + (kind === 'lorry' || kind === 'bus' ? 93 : 58));
      }
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
